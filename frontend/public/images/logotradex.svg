<svg width="220" height="56" viewBox="0 0 220 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gtext" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Candlestick bars -->
  <rect x="0"  y="28" width="8" height="18" rx="2" fill="#2563EB" opacity="0.35"/>
  <rect x="11" y="18" width="8" height="28" rx="2" fill="#2563EB" opacity="0.55"/>
  <rect x="22" y="10" width="8" height="36" rx="2" fill="#2563EB" opacity="0.75"/>
  <rect x="33" y="3"  width="8" height="43" rx="2" fill="url(#g1)"/>

  <!-- Wicks -->
  <line x1="4"  y1="24" x2="4"  y2="50" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="15" y1="14" x2="15" y2="50" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="26" y1="6"  x2="26" y2="50" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="37" y1="0"  x2="37" y2="50" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>

  <!-- Rising trend line -->
  <polyline points="4,48 15,34 26,20 37,8 50,2" fill="none" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="50" cy="2" r="3.5" fill="#06B6D4"/>

  <!-- Divider -->
  <line x1="62" y1="6" x2="62" y2="50" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Wordmark -->
  <text x="72" y="43" font-family="Arial Black, Arial, sans-serif" font-size="34" font-weight="900">
    <tspan fill="url(#gtext)">Trade</tspan><tspan fill="#06B6D4">X</tspan>
  </text>
</svg>